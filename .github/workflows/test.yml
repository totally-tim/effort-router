name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Pinned, because the Mods API is early access and can change between
      # releases. 2.1.283 is the floor in the README and the release the mod
      # is developed and end-to-end tested on. npm published it on
      # 2026-09-25T18:46Z, more than 48 hours before this pin (an install-age rule).
      - run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.283
      # `.` validates the marketplace manifest; the plugin manifest path
      # validates the plugin and traces its hooks. Neither writes the type
      # declarations: they are committed under .claude-plugin/types.
      - run: claude plugin validate .
      - run: claude plugin validate .claude-plugin/plugin.json
      - run: npx --yes -p typescript@7.0.2 tsc --noEmit -p .
      - run: claude plugin test .
