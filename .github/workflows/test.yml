name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Pinned, because the Mods API is early access and can change between
      # releases. 2.1.281 is the newest release that was 48 hours old when
      # this workflow was written (an install-age rule); the mod is developed
      # and end-to-end tested on 2.1.283, its floor in the README. Move the
      # pin up once 2.1.283 is 48 hours old.
      - run: npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.281
      # Validation also writes the type declarations the typecheck reads.
      - run: claude plugin validate .
      - run: npx --yes -p typescript@7.0.2 tsc --noEmit -p .
      - run: claude plugin test .
